# Render blueprint: creates every service from this one file (Render > Blueprints > New).
# Builds use `--filter "app..."`: the app plus everything it depends on, in order (shared, sdk).
# Secrets marked sync: false are typed into the Render dashboard, never committed.
services:
  - type: web
    name: proofvault-api
    runtime: node
    plan: starter # not free: free plan sleeps, and a sleeping api misses webhooks
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "@proofvault/api..." build
    # Runs migrations, then seeds only the demo seller and product (never the fake scenarios).
    # Uses the project's own prisma and tsx, because pnpm from the build step may not exist here.
    preDeployCommand: cd apps/api && npx prisma migrate deploy && SEED_SCENARIOS=false npx prisma db seed
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: proofvault-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Provider-neutral, so switching LLM never changes this file (decided Nov 6: DeepSeek).
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: STORE_ORIGIN
        sync: false
      - key: DEMO_PASSCODE
        sync: false

  - type: web
    name: proofvault-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "@proofvault/web..." build
    staticPublishPath: apps/web/dist
    # Files in assets/ have a content hash in their name, so a browser may keep them for good.
    # Without this Render sends max-age=0 and every visit re-checks the 2 MB Studio bundle.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        sync: false
      - key: VITE_USE_FIXTURES
        value: 'false'

  - type: web
    name: proofvault-store
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "@proofvault/store..." build
    staticPublishPath: apps/store/dist
    # Files in assets/ have a content hash in their name, so a browser may keep them for good.
    # Without this Render sends max-age=0 and every visit re-checks the 2 MB Studio bundle.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        sync: false
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false

databases:
  - name: proofvault-db
    plan: basic-256mb
    region: frankfurt
    databaseName: proofvault
    user: proofvault
